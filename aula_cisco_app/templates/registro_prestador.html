<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Prestador - Aula Cisco</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen py-10">
    <div class="max-w-lg mx-auto bg-white p-8 rounded-xl shadow-md">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Alta de Prestador</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              {% if category == 'error' %}
                <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 text-sm">{{ message }}</div>
              {% endif %}
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('registrar_prestador') }}" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Número de Cuenta</label>
                <input type="text" name="numero_cuenta" required class="w-full px-4 py-2 border border-gray-300 rounded-md outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo</label>
                <input type="text" name="nombre" required class="w-full px-4 py-2 border border-gray-300 rounded-md outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Modalidad</label>
                    <select name="modalidad" required class="w-full px-4 py-2 border border-gray-300 rounded-md outline-none focus:ring-blue-500 bg-white">
                        <option value="6_meses">6 Meses</option>
                        <option value="12_meses">1 Año</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Inicio del Servicio</label>
                    <input type="text" name="fecha_inicio" placeholder="DD/MM/AAAA" pattern="\d{2}/\d{2}/\d{4}" title="Formato requerido: DD/MM/AAAA (Ej. 15/08/2026)" required class="w-full px-4 py-2 border border-gray-300 rounded-md outline-none focus:ring-blue-500 bg-white">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña Provisional</label>
                <input type="password" name="password" required class="w-full px-4 py-2 border border-gray-300 rounded-md outline-none focus:ring-blue-500">
            </div>
            
            <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 px-4 rounded-md hover:bg-green-700 transition">Guardar Prestador</button>
        </form>

        <div class="mt-6 text-center">
            <a href="{{ url_for('dashboard') }}" class="text-blue-600 hover:underline">← Volver al Panel</a>
        </div>
    </div>
</body>
</html>
